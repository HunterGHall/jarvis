[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "A command-line AI assistant powered by Claude, with tools for your PC, the web, and your Google account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3.0",
    "rich>=13.0.0",
    "pypdf>=4.0.0",
    # Voice: listening and speaking. On Windows, pip's default torch is the CPU build; for an NVIDIA GPU install with
    # --extra-index-url https://download.pytorch.org/whl/cu128 (see the README).
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.10.0",
    "huggingface_hub",
    "accelerate",
    "pydub",
    "psutil",
    "soundfile",
    "pedalboard>=0.9,<0.9.21",
]

[project.scripts]
jarvis = "jarvis.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
exclude = ["jarvis.models.conversations*"]
namespaces = true

[tool.setuptools.package-data]
jarvis = ["assets/*", "models/training_data/*.txt", "vendor/LICENSE"]
